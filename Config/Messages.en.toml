# UniBot message text configuration (English pack)
# This file defines all prompts / broadcasts sent by the bot, supporting {placeholder} formatting.
# The message pack is selected by the language field in Config.toml (zh / en); edits apply instantly on save.
# Missing required keys will cause a startup failure; do not remove existing keys.
#
# Placeholder notes (varies per message, see comments next to each key):
#   {content}  message content    {server}  server name
#   {player}   player name       {user}    user ID      {name} username
#   {death}    full death message returned by Minecraft (including cause)
#   {achievement} full advancement message returned by Minecraft
# ...

# Hidden Start

# Content between the following markers is NOT shown in the WebUI message editor:
# it is preserved automatically on save and still loaded by the bot.
# Put keys you do not want edited from the WebUI here.

# ===== Built-in extension display names (used by the WebUI extension list and docs) =====
[builtin_extensions]
send = "Message Sender"
bound = "Player Binding"
command = "Console Command"
help = "Command Help"
list = "Online Players"
luck = "Daily Luck"
server = "Server List"
bot = "Bot Management"
servers = "Minecraft Server Service"
players = "Player Account Service"

# ===== Built-in plugin metadata and replies =====
[plugins.events]
name = "Message Sync"
description = "Handles player events and message syncing between chat platforms and Minecraft servers."
usage = "Triggered automatically by related messages and server events."

[plugins.token]
name = "Auth Token"
description = "Listens to messages on every platform, verifies auth tokens and authorizes groups and users."
usage = "Send the auth token printed by the bot in any platform group chat to complete authorization."
# Auth result broadcast: {results} is the joined text of multiple results
auth_success = "Authentication succeeded:\n  {results}"
result_separator = ";\n  "
group_already_authorized = "This group is already authorized"
group_authorized = "Added this group to {groups}"
already_superuser = "You are already a superuser"
superuser_write_failed = "Failed to write superuser config"
superuser_granted = "You have been granted superuser permissions"

# Hidden End

[events]
# Player events and message sync broadcasts
player_join = "Player {player} joined the game."
player_join_group = "Player {player} joined server [{server}], meow~"
fake_join_game = "[{server}] Fake player {player} joined the game."
fake_join_group = "Fake player {player} joined server [{server}]."
player_quit = "Player {player} left the game."
player_quit_group = "Player {player} left server [{server}]..."
fake_quit_game = "Fake player {player} left the game."
fake_quit_group = "Fake player {player} left server [{server}]."
player_death = "{death}"
player_achievement = "{achievement}"
chat_forward = "[{server}] <{player}> {content}"
sensitive_reply = "The message contains sensitive words and was dropped!"
need_content = "Please type the message you want to send after the command!"
sent_success = "Message sent!"
# Message segment placeholders (replacing non-text segments such as images/videos when forwarding into the game)
segment_at = "[@{target}]"
segment_quote_with_content = "[Quote: {content}]"
segment_quote = "[Quoted message]"
segment_at_all = "[@everyone]"
segment_emoji = "[Animated emoji]"
segment_image = "[Image]"
segment_video = "[Video]"
segment_audio = "[Voice]"
segment_file = "[File]"
# Death/advancement broadcast fallbacks (used when the server does not return full text)
death_fallback = "{player} died"
achievement_fallback = "{player} made the advancement [{title}]"
achievement_unknown = "unknown advancement"

[commands.send]
# Prompts for sending messages to servers
description = "Send messages to connected Minecraft servers."
usage = "/send <message>"
arg_message = "the message content to send"
param_error = "Invalid arguments, please check the command format!"
sent = "Message sent to the server: {content}."
not_bound = "Your player name was not found; please bind your account first!"
# Format of messages forwarded into the server; unknown_user_name is used when the sender cannot be identified
broadcast_format = "[{platform}]<{name}> {content}"
unknown_user_name = "unknown user"

