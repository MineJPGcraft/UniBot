usage = "/bound [player|subcommand]"
option_player = "The player name to bind"
list_desc = "List all bindings"
query_desc = "Query bindings of a specific user"
remove_desc = "Remove bindings"
append_desc = "Append a binding for a specific user"
arg_user = "user"
arg_player = "player"
invalid_name = "Invalid player name! A player name may only contain letters, digits and underscores, and must be at most 16 characters long."
already_bound = "You have already bound this whitelist entry!"
occupied = "This player name is already bound; please choose another one!"
server_offline = "No server is currently connected; binding failed! Please contact an administrator to reconnect and try again."
bound_success = "User {name}({user}) has successfully bound the whitelist to player {player}."
too_many = "You have bound too many players; binding failed!"
no_permission = "You do not have permission to run this command!"
no_binding = "No players are bound yet!"
list_title = "Whitelist list:"
not_bound_query = "User ({target_user}) has not bound any whitelist entries!"
query_result = "Whitelist entries bound by user ({target_user}): {players}."
invalid_name_short = "Invalid player name! A player name may only contain letters, digits and underscores, and must be at most 16 characters long."
server_offline_try = "No server is currently connected; please try again later!"
remove_success = "Removed whitelist entry {player_name}!"
