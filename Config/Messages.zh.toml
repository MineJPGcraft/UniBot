# UniBot 消息文本配置（中文包）
# 本文件定义机器人对外发送的所有提示/播报文本，支持 {占位符} 格式化。
# 通过 Config.toml 的 language 字段选择加载 zh / en 对应的消息包；修改后保存即热生效。
# 缺失必填项会导致启动失败，请勿删除已有键。
#
# 占位符说明（随具体消息不同，见各键注释）：
#   {content}  消息内容    {server}  服务器名称
#   {player}   玩家名称    {user}    用户 ID      {name} 用户名
#   {death}    Minecraft 返回的完整死亡消息（包含死因）
#   {achievement} Minecraft 返回的完整成就消息
# ...

# Hidden Start

# 下面这对标记之间的内容不会显示在 WebUI「消息文本」编辑器中：
# 保存时自动保留、机器人照常加载，可放置不想被 WebUI 修改的键。

# ===== 内置扩展显示名称（WebUI 扩展列表与文档使用） =====
[builtin_extensions]
send = "消息发送"
bound = "玩家绑定"
command = "控制台命令"
help = "命令帮助"
list = "在线玩家"
luck = "今日人品"
server = "服务器列表"
bot = "机器人管理"
servers = "Minecraft 服务器服务"
players = "玩家账号服务"

# ===== 内置插件元数据与回复 =====
[plugins.events]
name = "消息互通"
description = "处理玩家事件以及聊天平台与 Minecraft 服务器之间的消息同步。"
usage = "由相关消息与服务器事件自动触发。"

[plugins.token]
name = "认证令牌"
description = "监听所有平台消息，校验认证令牌并授权群聊与用户。"
usage = "在任意平台群聊中发送机器人打印的认证令牌即可完成授权。"
# 认证结果播报：{results} 为多条结果的拼接文本
auth_success = "认证成功：\n  {results}"
result_separator = "；\n  "
group_already_authorized = "本群已在授权列表中"
group_authorized = "已将本群加入 {groups}"
already_superuser = "你已是超级用户"
superuser_write_failed = "超级用户写入失败"
superuser_granted = "已将你设为超级用户"

# Hidden End

[events]
# 玩家事件与消息同步相关播报
player_join = "玩家 {player} 加入了游戏。"
player_join_group = "玩家 {player} 加入了 [{server}] 服务器，喵～"
fake_join_game = "[{server}] 机器人 {player} 加入了游戏。"
fake_join_group = "机器人 {player} 加入了 [{server}] 服务器。"
player_quit = "玩家 {player} 离开了游戏。"
player_quit_group = "玩家 {player} 离开了 [{server}] 服务器，呜……"
fake_quit_game = "机器人 {player} 离开了游戏。"
fake_quit_group = "机器人 {player} 离开了 [{server}] 服务器。"
player_death = "{death}"
player_achievement = "{achievement}"
chat_forward = "[{server}] <{player}> {content}"
sensitive_reply = "检测到消息包含敏感词，已丢弃！"
need_content = "请在指令后输入要发送的消息！"
sent_success = "消息已发送！"
# 消息段落占位（转发到游戏内时替换图片/视频等非文本段）
segment_at = "[@{target}]"
segment_quote_with_content = "[引用：{content}]"
segment_quote = "[引用消息]"
segment_at_all = "[@全体成员]"
segment_emoji = "[动画表情]"
segment_image = "[图片]"
segment_video = "[视频]"
segment_audio = "[语音]"
segment_file = "[文件]"
# 死亡/成就播报兜底文案（服务器未返回完整文本时使用）
death_fallback = "{player} 死亡了"
achievement_fallback = "{player} 达成了成就 [{title}]"
achievement_unknown = "未知成就"

[commands.send]
# 发送消息到服务器相关提示
description = "向已连接的服务器发送消息。"
usage = "/send <消息内容>"
