[project]
name = "Minecraft_UniBot"
version = "v2.0.0-pre"
description = "一款与 Minecraft 互通的 Nonebot2 机器人。"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "tomlkit>=0.13.0",
    "packaging>=24.0",
    "nonebot2[fastapi]>=2.2.1",
    "nonebot-adapter-minecraft>=1.8.2",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot-plugin-uninfo>=0.11.0",
]

[project.optional-dependencies]
webui = [
    "psutil>=6.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "cryptography>=43.0.3,<49.0.0",
    "qrcode[pil]>=7.4",
]
extensions = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "SIM", "UP", "C90", "PLR", "TRY", "RET", "BLE"]
ignore = [
    "E501",
    "SIM108",
    # 异常信息由捕获点上下文化，无需每条 raise 都带独立长消息（框架层统一文案）
    "TRY003",
    # 魔法数值多为协议常量/范围判定，硬性阈值改用具名常量意义有限
    "PLR2004",
    # 框架回调/API 签名由第三方契约决定，位置参数与数量不可随意收敛
    "PLR0913",
    "PLR0917",
    # 项目风格鼓励守卫子句早返回，多 return 是预期写法（见 AGENT.md §14）
    "PLR0911",
    # 扩展/插件加载与调用需捕获宽泛异常以保证隔离与健壮性，属预期设计
    "BLE001",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["Core", "Extensions"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.uv]
index-url = "https://mirrors.huaweicloud.com/repository/pypi/simple"

[tool.unibot]
# 此版本对应的 WebUi 版本
webui_version = 'v2.0.0-pre'

[tool.nonebot]
# 插件登记已移出 pyproject.toml（运行时状态存于 Config/Plugins.toml）；
# 框架内置插件由 Bot.py 程序化加载，用户/市场插件读 Config/Plugins.toml。

[[tool.nonebot.adapters]]
name = "Minecraft"
module_name = "nonebot.adapters.minecraft"
