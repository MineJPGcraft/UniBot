[project]
name = "Minecraft_UniBot"
version = "v1.0.2"
description = "一款与 Minecraft 互通的 Nonebot2 机器人。"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "tomlkit>=0.13.0",
    "packaging>=24.0",
    "nonebot2[fastapi]>=2.2.1",
    "nonebot-adapter-minecraft>=1.8.2",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot-plugin-uninfo>=0.11.0",
]

[project.optional-dependencies]
webui = [
    "psutil>=6.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "qrcode[pil]>=7.4",
]
extensions = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "SIM", "UP"]
ignore = ["E501", "SIM108"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["Extensions", "Scripts"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.uv]
index-url = "https://mirrors.huaweicloud.com/repository/pypi/simple"

[tool.unibot]
# 此版本对应的 WebUi 版本
webui_version = 'v1.0.2'

[tool.nonebot]
plugins = [
    { module_name = "Scripts.Plugins.Events", enabled = true },
    { module_name = "Scripts.Plugins.Token", enabled = true },
]

[[tool.nonebot.adapters]]
name = "Minecraft"
module_name = "nonebot.adapters.minecraft"
