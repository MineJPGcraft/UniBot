name: Release Package

# 发布 Release 时自动打包项目为 Zip 并上传到构建产物
on:
  release:
    types: [published]
  # 支持手动触发（方便测试打包流程）
  workflow_dispatch:

permissions:
  # gh release upload 需要写权限，仅用于把 zip 附加到 Release
  contents: write

jobs:
  package:
    name: Package and Upload Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 前端源码随核心仓库分发，发布包需要内置构建产物（直放 WebUi/ 下，不套 dist）
      - name: Build WebUI
        working-directory: WebUi
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package project into Zip (exclude tests / docs)
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_NAME="UniBot.zip"

          # 打包仓库内容，排除：
          #   - .git/            ：git 元数据，对用户无用
          #   - .github/         ：CI/CD 工作流，对用户无用
          #   - tests/           ：测试代码
          #   - docs/ Docs/      ：文档（兼容大小写，含任意层级嵌套）
          #   - WebUi/           ：前端源码与 node_modules（仅保留构建产物，直放 WebUi/ 下）
          zip -r "${ZIP_NAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" "*/tests/*" \
            -x "docs/*" "*/docs/*" \
            -x "Docs/*" "*/Docs/*" \
            -x "WebUi/*" \
            -x "WebUi/node_modules/*" \
            -x "WebUi/dist/*" \
            -x "*/node_modules/*" \
            -x "**/__pycache__/*"

          # 只把构建产物放进包里：产物直放 WebUi/ 下（不套一层 dist），
          # 先复制到临时目录再按 WebUi/ 前缀打包（zip 无法重写条目路径）
          STAGE_DIR="$(mktemp -d)"
          mkdir -p "${STAGE_DIR}/WebUi"
          cp -R WebUi/dist/. "${STAGE_DIR}/WebUi/"
          (cd "${STAGE_DIR}" && zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" WebUi)
          rm -rf "${STAGE_DIR}"

          echo "打包完成: ${ZIP_NAME}"
          ls -lh "${ZIP_NAME}"

          # 导出给后续步骤使用（env 会跨 step 保留）
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Attach zip to GitHub Release
        # 仅 Release 触发时附加；手动触发没有 Release，跳过
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 把打包好的 UniBot.zip 作为 Release 资产上传，供 Install.bat / Install.sh 下载
          gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP_NAME }}" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniBot
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
